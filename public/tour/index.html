/apple-icon.png?apple-icon.2zlmi9n507165.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script src="/tour/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body><div hidden=""><!--$--><!--/$--></div><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><noscript><main class="fallback"><h1>Radoya<!-- --> — an interactive 3D experience by <!-- -->Simon Maxam</h1><p>I’m Simon Maxam, the founder of Radoya — a web developer and 3D artist based in Calgary, Alberta, creating since 2010. I build immersive websites, interactive 3D worlds and games. Radoya turns a property, or a plan of one that isn’t built yet, into a space you can walk through in your browser, on your phone, with no powerful computer needed. “Rado” echoes the Latin radius, a ray of light, and means “gladly” in Slavic languages; “ya” is you. Gladly shining a light on you.</p><section><h2>01<!-- --> <!-- -->Ridgeline House</h2><p>Calgary<!-- -->, <!-- -->AB<!-- --> · <!-- -->Residential<!-- --> · <!-- -->2026<!-- --> · <!-- -->330 m²</p><p>A board-formed concrete base is dug into the slope and glazed to a reflecting pool. A two-storey west wing holds the bedrooms, and the upper floor cantilevers six metres toward the view, carried on two steel columns.</p></section><section><h2>02<!-- --> <!-- -->Atrium / 09</h2><p>Toronto<!-- -->, <!-- -->ON<!-- --> · <!-- -->Cultural<!-- --> · <!-- -->2025<!-- --> · <!-- -->8,400 m²</p><p>Four floors of galleries wrap a top-lit void planted with a single tree. The plaza facade is a finned curtain wall that turns from transparent to solid as you walk past it.</p></section><section><h2>03<!-- --> <!-- -->House / Kai</h2><p>Tofino<!-- -->, <!-- -->BC<!-- --> · <!-- -->Hospitality<!-- --> · <!-- -->2027<!-- --> · <!-- -->2,100 m²</p><p>A retreat of three oak pavilions on a stone deck at the edge of the rainforest. Deep roofs and slatted screens filter the coastal light; every room opens to the water.</p></section><h2>Services</h2><ul><li>Architecture<!-- --> — <!-- -->Buildings from first sketch to handover.</li><li>Interior<!-- --> — <!-- -->Rooms, joinery, light and furniture.</li><li>Masterplanning<!-- --> — <!-- -->Sites, neighbourhoods and phasing.</li><li>Development<!-- --> — <!-- -->Feasibility, partners and delivery.</li><li>Visualization<!-- --> — <!-- -->Drawings, models and film.</li><li>Consulting<!-- --> — <!-- -->Planning, heritage and briefs.</li></ul><p><a href="mailto:simonmaxam.tech@gmail.com">simonmaxam.tech@gmail.com</a> · <!-- -->+1 403 555 0142</p><p>Designed and built by <!-- -->Simon Maxam<!-- --> with <!-- -->Three.js, Blender, Unreal Engine 5, Revit, Siemens NX, C++, Python<!-- -->.</p></main></noscript><!--$--><!--/$--><script src="/tour/_next/static/chunks/09lgyggnhjlha.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[39756,[\"/tour/_next/static/chunks/3fntmmi971322.js\"],\"default\"]\n3:I[37457,[\"/tour/_next/static/chunks/3fntmmi971322.js\"],\"default\"]\n4:I[73379,[\"/tour/_next/static/chunks/3fntmmi971322.js\",\"/tour/_next/static/chunks/0wd6qmfix0lh-.js\"],\"default\"]\nb:I[97367,[\"/tour/_next/static/chunks/3fntmmi971322.js\"],\"OutletBoundary\"]\nc:\"$Sreact.suspense\"\ne:I[97367,[\"/tour/_next/static/chunks/3fntmmi971322.js\"],\"ViewportBoundary\"]\n10:I[97367,[\"/tour/_next/static/chunks/3fntmmi971322.js\"],\"MetadataBoundary\"]\n12:I[68027,[\"/tour/_next/static/chunks/3fntmmi971322.js\"],\"default\",1]\n:HL[\"/tour/_next/static/chunks/0igdwivod466f.css\",\"style\"]\n:HL[\"/tour/_next/static/media/797e433ab948586e-s.p.0r6juujl39pe6.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n:HL[\"/tour/_next/static/media/ab57efd000576a30-s.p.3fofz6dws3mg0.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n:HL[\"/tour/_next/static/media/pacalix_solid-s.p.0qy8feblnb72m.woff2\",\"font\",{\"crossOrigin\":
